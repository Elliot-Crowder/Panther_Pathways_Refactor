      import { PathfindingAPI } from "./js/main.js"
      const startLocations = ["PAS", "MAK", "LUC", "CST", "HSP", "CDC", "PAN", "UNS", "NOG", "STC", "SOG", "BUS", "LRC", "NAS", "MOH", "RHS", "RHN", "CIC", "FFA", "PAC", "STS", "SHW", "COS", "TEC", "ACT"]; //list of strings
      const endLocations = ["PAS", "MAK", "LUC", "CST", "HSP", "CDC", "PAN", "UNS", "NOG", "STC", "SOG", "BUS", "LRC", "NAS", "MOH", "RHS", "RHN", "CIC", "FFA", "PAC", "STS", "SHW", "COS", "TEC", "ACT"]; //list of strings

      const startLocationSelector = document.getElementById("startLocator");
      const endLocationSelector = document.getElementById("endLocator");
      const startList = document.getElementById("startSuggestions");
      const endList = document.getElementById("endSuggestions");

      let finalStartLocation = null;
      let finalEndLocation = null;

      startLocationSelector.addEventListener("keyup", (event) => {
        const qry = startLocationSelector.value.toLowerCase();
        const filteredLocations = startLocations.filter((item) => item.toLowerCase().includes(qry));
        console.log(filteredLocations);
        startList.innerHTML = "";

        for (let i = 0; i < filteredLocations.length; i++) {
          const li = document.createElement("li");
          li.textContent = filteredLocations[i];
          startList.appendChild(li);
        }

        console.log(startList);
       

        if (!qry.length) {
          startList.innerHTML = "";
        }
      });

      startList.addEventListener("click", (event) => {

        if (event.target.tagName === "LI") {
          startLocationSelector.value = event.target.textContent;
          startList.innerHTML = "";
        }
        finalStartLocation = "vnode-" + startLocationSelector.value;
        if (finalStartLocation && finalEndLocation) {
          const path = PathfindingAPI.findPath(finalStartLocation, finalEndLocation);

          connectCircles(path);
        }

      });

        endLocationSelector.addEventListener("keyup", (event) => {
        const qry = endLocationSelector.value.toLowerCase();
        const filteredLocations = endLocations.filter((item) => item.toLowerCase().includes(qry));
        console.log(filteredLocations);
        endList.innerHTML = "";

        for (let i = 0; i < filteredLocations.length; i++) {
          const li = document.createElement("li");
          li.textContent = filteredLocations[i];
          endList.appendChild(li);
        }

        if (!qry.length) {
          endList.innerHTML = "";
        }
      });

      endList.addEventListener("click", (event) => {

          endList.innerHTML = "";
        }
        finalEndLocation = "vnode-" + endLocationSelector.value;
        if (finalStartLocation && finalEndLocation) {
          const path = PathfindingAPI.findPath(finalStartLocation, finalEndLocation);

          connectCircles(path);
        }
      });

      function connectCircles(ids) {
        const svg = document.querySelector("svg");
        const linesGroup = document.getElementById("lines");

        // Clear existing lines
        linesGroup.innerHTML = "";

        // Connect each circle to the next one in the array
        for (let i = 0; i < ids.length - 1; i++) {
          const circle1 = document.getElementById(ids[i]);
          const circle2 = document.getElementById(ids[i + 1]);

          if (circle1 && circle2) {
            const x1 = circle1.getAttribute("cx");
            const y1 = circle1.getAttribute("cy");
            const x2 = circle2.getAttribute("cx");
            const y2 = circle2.getAttribute("cy");

            const line = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "line"
            );
            line.setAttribute("x1", x1);
            line.setAttribute("y1", y1);
            line.setAttribute("x2", x2);
            line.setAttribute("y2", y2);
            line.setAttribute("stroke", "#0000FF");
            line.setAttribute("stroke-width", "2");
            line.setAttribute("stroke-linecap", "round")

            linesGroup.appendChild(line);
          }
        }
      }
